name: Deploy

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q uv
          uv sync

      - name: Run safety-gate evals
        run: uv run python -m eval.harness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}

  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "⚠️  VERCEL_TOKEN not set. Skipping Vercel deployment."
            echo "To enable auto-deploy:"
            echo "1. Get Vercel token from https://vercel.com/account/tokens"
            echo "2. Add to GitHub Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            exit 0
          fi

          npm install -g vercel
          vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --prod --yes \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --project-id ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "⚠️  RENDER_API_KEY or RENDER_SERVICE_ID not set. Skipping Render deployment."
            echo "To enable auto-deploy:"
            echo "1. Get Render API key from https://dashboard.render.com/account/api-tokens"
            echo "2. Get service ID from your Render service URL"
            echo "3. Add to GitHub Secrets: RENDER_API_KEY, RENDER_SERVICE_ID"
            exit 0
          fi

          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}

  notification:
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [[ "${{ needs.deploy-frontend.result }}" == "success" && "${{ needs.deploy-backend.result }}" == "success" ]]; then
            echo "✅ Deployment successful!"
            echo "Frontend: https://resolveflow-web-officialbidishas-projects.vercel.app"
            echo "Backend: https://resolveflow-1h99.onrender.com"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
