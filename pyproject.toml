[project]
name = "resolveflow"
version = "0.1.0"
description = "GitHub issue diagnosis and approval-gated execution agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.2.9",
    "langchain-core>=0.3",
    "langchain-community>=0.4",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.9",
    "pydantic>=2.9",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "langchain-openai>=1.5.2",
    "streamlit>=1.62.0",
    "scikit-learn>=1.9.0",
    "langchain-pinecone>=0.2",
    "pinecone>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "black>=25.0",
]
